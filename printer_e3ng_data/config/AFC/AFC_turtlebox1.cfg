[include mcu/AFC_Lite.cfg]

[mcu turtlebox1]
#canbus_uuid: <replace with your can UUID>
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_340039000851333235393937-if00

[AFC_BoxTurtle turtlebox1]
hub: turtlebox1
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
buffer: turtlebox1 # If not defined below from the install script, uncomment and add buffer name if using a buffer

[AFC_buffer turtlebox1]
advance_pin: ^turtlebox1:TN_ADV    # set advance pin
trailing_pin: ^turtlebox1:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament







[temperature_sensor turtlebox1]
sensor_type: temperature_mcu
sensor_mcu: turtlebox1

[AFC_stepper lane1]
unit: turtlebox1:1
step_pin: turtlebox1:M1_STEP
dir_pin: !turtlebox1:M1_DIR
enable_pin: !turtlebox1:M1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 140.09 
park_dist: 10
led_index: AFC_Indicator:1
afc_motor_rwd: turtlebox1:MOT1_RWD
afc_motor_fwd: turtlebox1:MOT1_FWD
afc_motor_enb: turtlebox1:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!turtlebox1:TRG1
load: ^turtlebox1:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: turtlebox1:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: turtlebox1:2
step_pin: turtlebox1:M2_STEP
dir_pin: !turtlebox1:M2_DIR
enable_pin: !turtlebox1:M2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 77.78 
park_dist: 10
led_index: AFC_Indicator:2
afc_motor_rwd: turtlebox1:MOT2_RWD
afc_motor_fwd: turtlebox1:MOT2_FWD
afc_motor_enb: turtlebox1:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!turtlebox1:TRG2
load: ^turtlebox1:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: turtlebox1:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: turtlebox1:3
step_pin: turtlebox1:M3_STEP
dir_pin: !turtlebox1:M3_DIR
enable_pin: !turtlebox1:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 90.0
park_dist: 10
led_index: AFC_Indicator:3
afc_motor_rwd: turtlebox1:MOT3_RWD
afc_motor_fwd: turtlebox1:MOT3_FWD
afc_motor_enb: turtlebox1:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!turtlebox1:TRG3
load: ^turtlebox1:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: turtlebox1:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: turtlebox1:4
step_pin: turtlebox1:M4_STEP
dir_pin: !turtlebox1:M4_DIR
enable_pin: !turtlebox1:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 145.0
park_dist: 10
led_index: AFC_Indicator:4
afc_motor_rwd: turtlebox1:MOT4_RWD
afc_motor_fwd: turtlebox1:MOT4_FWD
afc_motor_enb: turtlebox1:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
