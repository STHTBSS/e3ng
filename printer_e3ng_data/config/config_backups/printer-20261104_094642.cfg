# Happy Hare MMU includes (should be near top of file)
# Happy Hare MMU includes (should be near top of file)
[include mainsail.cfg]
[include macros.cfg]
[include timelapse.cfg]
[include fans.cfg]
[include leds.cfg]
[include AFC/*.cfg]



#driver0
# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 230
homing_speed: 50


[tmc5160 stepper_x]
cs_pin: PC4
run_current: 1.1
stealthchop_threshold: 0
sense_resistor: 0.075
interpolate: False
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5


[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
endstop_pin: PG9
position_endstop: 240
position_max: 245
homing_speed: 50
##homing_positive_dir: false


#driver1
[tmc5160 stepper_y]
cs_pin: PD11
run_current: 1.1
stealthchop_threshold: 0
sense_resistor: 0.075
interpolate: False
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5


[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 128
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.0
position_min: -5
position_max: 230
homing_speed: 15          # first probe speed
second_homing_speed: 3   # second probe speed (slower = more accurate)
homing_retract_dist: 0


#driver 2
[tmc5160 stepper_z]
cs_pin: PC6
run_current: 1
stealthchop_threshold: 0
sense_resistor: 0.075
interpolate: False
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5


[extruder]
max_extrude_only_distance: 10000.0
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 32
rotation_distance: 5.537
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF4
min_extrude_temp: 0
control: mpc
heater_power: 50  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 
min_temp: -1
max_temp: 350


[tmc5160 extruder]
cs_pin: PE1
run_current: 0.5
hold_current: 0.3
stealthchop_threshold: 0
sense_resistor: 0.075
interpolate: False
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5


[heater_bed]
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130


[temperature_sensor chamber_top]
sensor_type: Generic 3950
sensor_pin: PF7
#min_temp: 0
#max_temp: 100
#   See the "extruder" section for the definition of the above
#   parameters.
gcode_id: chamber_top
#   See the "heater_generic" section for the definition of this
#   parameter.


[temperature_sensor chamber_bottom]
sensor_type: Generic 3950
sensor_pin: PF6
#min_temp: 0
#max_temp: 100
#   See the "extruder" section for the definition of the above
#   parameters.
gcode_id: chamber_bottom
#   See the "heater_generic" section for the definition of this
#   parameter.


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_270008000851323235363233-if00
restart_method: command


[mcu cartographer]  # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_550048001850303655333520-if00
is_non_critical: True
restart_method: command # Not needed for probes using CAN. 


[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 34.4 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output


[mcu octopus]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1E0033000751313031393839-if00
restart_method: command


[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 25
max_z_accel: 100




[danger_options]
#error_on_unused_config_options: True
#   If an unused config option or section should cause an error
#   if False, will warn but allow Kalico to still run.
#   The default is True.
#allow_plugin_override: False
#   Allows modules in `plugins` to override modules of the same name in `extras`
#   The default is False.
#single_mcu_trsync_timeout: 0.25
#   The timeout (in seconds) for MCU synchronization during the homing process when
#   a single MCUs is in use. The default is 0.25
#multi_mcu_trsync_timeout: 0.025
#   The timeout (in seconds) for MCU synchronization during the homing process when
#   multiple MCUs are in use. The default is 0.025
#homing_elapsed_distance_tolerance: 0.5
#   Tolerance (in mm) for distance moved in the second homing. Ensures the
#   second homing distance closely matches the `min_home_dist` when using
#   sensorless homing. The default is 0.5mm.
#temp_ignore_limits: False
#   When set to true, this parameter ignores the min_value and max_value
#   limits for temperature sensors. It prevents shutdowns due to
#   'ADC out of range' and similar errors by allowing readings outside the
#   specified range without triggering a shutdown. The default is False.
#autosave_includes: False
#   When set to true, SAVE_CONFIG will recursively read [include ...] blocks
#   for conflicts to autosave data. Any configurations updated will be backed
#   up to configs/config_backups.
#bgflush_extra_time: 0.250
#   This allows to set extra flush time (in seconds). Under certain conditions,
#   a low value will result in an error if message is not get flushed, a high value
#   (0.250) will result in homing/probing latency. The default is 0.250
#homing_start_delay: 0.001
#   How long to dwell before beginning a drip move for homing
endstop_sample_time: 0.000005
#   How often the MCU should sample the endstop state
#endstop_sample_count: 4
#   How many times we should check the endstop state when homing
#   Unless your endstop is noisy and unreliable, you should be able to lower this to 1


# Logging options:

#minimal_logging: False
#   Set the default for all log options. The default is False.
#log_statistics: True
#   If statistics should be logged
#   (helpful for keeping the log clean during development)
#   The default is True.
#log_config_file_at_startup: True
#   If the config file should be logged at startup
#   The default is True.
#log_bed_mesh_at_startup: True
#   If the bed mesh should be logged at startup
#   (helpful for keeping the log clean during development)
#   The default is True.
#log_velocity_limit_changes: True
#   If changes to velocity limits should be logged. If False, velocity limits will only
#   be logged at rollover. Some slicers emit very frequent SET_VELOCITY_LIMIT commands
#   The default is True
#log_pressure_advance_changes: True
#   If changes to pressure advance should be logged. If false, pressure advance data
#   will only be logged at rollover.
#   The default is True.
#log_shutdown_info: True
#   If we should log detailed crash info when an exception occurs
#   Most of it is overly-verbose and fluff and we still get a stack trace
#   for normal exceptions, so setting to False can help save time while developing
#   The default is True.
#log_serial_reader_warnings: True
#log_startup_info: True
#log_webhook_method_register_messages: TRUE

[safe_z_home]
home_xy_position: 135, 135
#   A X, Y coordinate (e.g. 100, 100) where the Z homing should be
#   performed. This parameter must be provided.
speed: 60.0
#   Speed at which the toolhead is moved to the safe Z home
#   coordinate. The default is 50 mm/s
z_hop:5
#   Distance (in mm) to lift the Z axis prior to homing. This is
#   applied to any homing command, even if it doesn't home the Z axis.
#   If the Z axis is already homed and the current Z position is less
#   than z_hop, then this will lift the head to a height of z_hop. If
#   the Z axis is not already homed the head is lifted by z_hop.
#   The default is to not implement Z hop.
z_hop_speed: 25.0
#   Speed (in mm/s) at which the Z axis is lifted prior to homing. The
#   default is 15 mm/s.
#move_to_previous: False
#   When set to True, the X and Y axes are reset to their previous
#   positions after Z axis homing. The default is False.


[bed_mesh]
zero_reference_position: 117, 117 # The centre of your bed. 
speed: 150
horizontal_move_z: 3
mesh_min: 40, 40 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 200, 190 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 50, 50
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough


[bed_screws]
screw1: 40, 154
screw2: 40, 1
screw3: 200, 1
screw4: 200, 154


[screws_tilt_adjust]
screw1: 40, 154
screw1_name: rear left screw
screw2: 40, 1
screw2_name: front left screw
screw3: 200, 1
screw3_name: front right screw
screw4: 200, 154
screw4_name: rear right screw
horizontal_move_z: 16.
speed: 75.
screw_thread: CW-M3


[temperature_sensor octo]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100


[temperature_sensor octopus]
sensor_type: temperature_mcu
sensor_mcu: octopus
min_temp: 0
max_temp: 100


[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105


[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100


[force_move]
enable_force_move: true


[exclude_object]


[verify_heater heater_bed]
check_gain_time: 120


[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1


[resonance_tester]
accel_chip: adxl345
probe_points:
    117, 117, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.
    
    
[virtual_sdcard]
path: /home/pi/printer_e3ng_data/gcodes


[display_status]


[pause_resume]


[axis_twist_compensation]
#speed: 50
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
#horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
calibrate_start_x: 40
#   Defines the minimum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the starting
#   calibration position.
calibrate_end_x: 200
#   Defines the maximum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the ending
#   calibration position.
calibrate_y: 112.5
#   Defines the Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle during the
#   calibration process. This parameter is recommended to
#   be near the center of the bed

# For Y-axis twist compensation, specify the following parameters:
calibrate_start_y: 40
#   Defines the minimum Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle at the starting
#   calibration position for the Y axis. This parameter must be provided if
#   compensating for Y axis twist.
calibrate_end_y: 155.6
#   Defines the maximum Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle at the ending
#   calibration position for the Y axis. This parameter must be provided if
#   compensating for Y axis twist.
calibrate_x: 112.5
#   Defines the X coordinate of the calibration for Y axis twist compensation
#   This should be the X coordinate that positions the nozzle during the
#   calibration process for Y axis twist compensation. This parameter must be
#   provided and is recommended to be near the center of the bed.

